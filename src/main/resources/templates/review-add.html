<!-- templates/review-add.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submit Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111318 !important; font-family: 'Segoe UI', sans-serif; }
        nav { background: rgba(10,10,10,0.9); padding: 14px 32px; border-bottom: 1px solid #2A2D35; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .logo { font-size: 18px; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #F5C518; }
        .nav-links { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .nav-links a { color: #7A7D85; text-decoration: none; font-size: 12px; padding: 5px 10px; border-radius: 8px; transition: all 0.2s; }
        .nav-links a:hover { color: #F5C518; background: rgba(245,197,24,0.08); }
        .user-badge-admin { background: rgba(245,197,24,0.15); color: #F5C518; border: 1px solid rgba(245,197,24,0.3); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .user-badge-customer { background: rgba(59,130,246,0.15); color: #3B82F6; border: 1px solid rgba(59,130,246,0.3); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .btn-logout { background: rgba(239,68,68,0.1); color: #EF4444; border: 1px solid rgba(239,68,68,0.2); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .btn-logout:hover { background: #EF4444; color: #fff; }
        .card { background: #1A1D24 !important; border: 1px solid #2A2D35 !important; border-radius: 16px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important; }
        .card-header { background: #F5C518 !important; border-radius: 16px 16px 0 0 !important; padding: 18px 24px !important; border-bottom: none !important; }
        .card-header h4 { color: #0A0A0A !important; font-weight: 700; margin: 0; font-size: 20px; }
        .card-body { padding: 28px 24px !important; }
        .form-label { color: #9A9DA5 !important; font-size: 12px !important; font-weight: 600 !important; letter-spacing: 0.8px !important; text-transform: uppercase !important; margin-bottom: 8px !important; transition: color 0.2s; }
        .form-control { background: rgba(255,255,255,0.05) !important; border: 1px solid #2A2D35 !important; border-radius: 10px !important; color: #F0F0F0 !important; padding: 12px 16px !important; font-size: 15px !important; transition: all 0.25s !important; }
        .form-control::placeholder { color: #555860 !important; }
        .form-control:focus { background: rgba(245,197,24,0.06) !important; border-color: #F5C518 !important; box-shadow: 0 0 0 3px rgba(245,197,24,0.12) !important; color: #F0F0F0 !important; }
        textarea.form-control { resize: none; min-height: 100px; }
        .btn-warning { background: #F5C518 !important; border: none !important; color: #0A0A0A !important; font-weight: 700 !important; font-size: 15px !important; padding: 13px !important; border-radius: 10px !important; transition: all 0.25s !important; }
        .btn-warning:hover { background: #D4A800 !important; transform: translateY(-2px) !important; color: #0A0A0A !important; }
        .card-footer { background: #161820 !important; border-top: 1px solid #2A2D35 !important; border-radius: 0 0 16px 16px !important; padding: 14px 24px !important; }
        .btn-outline-secondary { color: #7A7D85 !important; border-color: #2A2D35 !important; border-radius: 8px !important; font-size: 13px !important; }
        .btn-outline-secondary:hover { background: #2A2D35 !important; color: #F0F0F0 !important; }
        .mb-3 { margin-bottom: 18px !important; }
        .star-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .star-btn { background: none; border: none; font-size: 28px; cursor: pointer; opacity: 0.3; transition: opacity 0.2s, transform 0.1s; }
        .star-btn.active { opacity: 1; transform: scale(1.15); }
    </style>
</head>
<body>
<nav>
    <a class="logo" th:href="${user.role == 'ADMIN'} ? '/admin/dashboard' : '/customer/dashboard'">Ride<span>Ease</span></a>
    <div class="nav-links">
        <a href="/bookings/list">🚕 Bookings</a>
        <a th:if="${user.role == 'ADMIN'}" href="/users/list">👤 Users</a>
        <a th:if="${user.role == 'ADMIN'}" href="/drivers/list">🚗 Drivers</a>
        <a href="/payments/list">💳 Payments</a>
        <a th:if="${user.role == 'ADMIN'}" href="/vehicles/list">🚙 Vehicles</a>
        <a href="/reviews/list">⭐ Reviews</a>
        <span th:if="${user.role == 'ADMIN'}" class="user-badge-admin">👑 <span th:text="${user.username}"></span></span>
        <span th:if="${user.role != 'ADMIN'}" class="user-badge-customer">👤 <span th:text="${user.username}"></span></span>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4>⭐ Submit Review</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/reviews/create}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Booking ID</label>
                            <input type="text" name="bookingId" class="form-control" placeholder="Enter booking ID" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Passenger Name</label>
                            <input type="text" name="passengerName" class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rating</label>
                            <div class="star-row" id="starRow">
                                <button type="button" class="star-btn active" data-val="1">⭐</button>
                                <button type="button" class="star-btn active" data-val="2">⭐</button>
                                <button type="button" class="star-btn active" data-val="3">⭐</button>
                                <button type="button" class="star-btn active" data-val="4">⭐</button>
                                <button type="button" class="star-btn active" data-val="5">⭐</button>
                            </div>
                            <input type="hidden" name="rating" id="ratingInput" value="5">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Comment</label>
                            <textarea name="comment" class="form-control" placeholder="Write your review..." required></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">⭐ Submit Review</button>
                    </form>
                </div>
                <div class="card-footer">
                    <a th:href="@{/reviews/list}" class="btn btn-outline-secondary btn-sm">View All Reviews →</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const stars = document.querySelectorAll('.star-btn');
    const ratingInput = document.getElementById('ratingInput');

    stars.forEach(star => {
      star.addEventListener('click', function() {
        const val = parseInt(this.dataset.val);
        ratingInput.value = val;
        stars.forEach((s, i) => s.classList.toggle('active', i < val));
      });
    });

    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
        const label = this.closest('.mb-3').querySelector('.form-label');
        if (label) label.style.color = '#F5C518';
      });
      input.addEventListener('blur', function() {
        const label = this.closest('.mb-3').querySelector('.form-label');
        if (label) label.style.color = '#9A9DA5';
      });
    });

    document.querySelector('form').addEventListener('submit', function() {
      const btn = this.querySelector('.btn-warning');
      btn.innerHTML = '⏳ Submitting...'; btn.style.opacity = '0.8';
    });
</script>
</body>
</html>
