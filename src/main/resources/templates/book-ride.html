<!-- templates/book-ride.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book a Ride</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning">
                    <h4>🚕 Book a Ride</h4>
                </div>
                <div class="card-body">
                    <!-- Form — /bookings/create POST -->
                    <form th:action="@{/bookings/create}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Passenger Name</label>
                            <input type="text" name="passengerName"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Pickup Location</label>
                            <input type="text" name="pickupLocation"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Drop Location</label>
                            <input type="text" name="dropLocation"
                                   class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-warning w-100">
                            Book Now
                        </button>
                    </form>
                </div>
                <div class="card-footer">
                    <a th:href="@{/bookings/list}" class="btn btn-outline-secondary btn-sm">
                        View All Bookings
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
