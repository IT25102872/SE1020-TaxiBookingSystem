<!-- templates/book-ride.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book a Ride</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background: #111318 !important;
          font-family: 'Segoe UI', sans-serif;
        }

        .card {
          background: #1A1D24 !important;
          border: 1px solid #2A2D35 !important;
          border-radius: 16px !important;
          box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
        }

        .card-header {
          background: #F5C518 !important;
          border-radius: 16px 16px 0 0 !important;
          padding: 18px 24px !important;
          border-bottom: none !important;
        }

        .card-header h4 {
          color: #0A0A0A !important;
          font-weight: 700;
          margin: 0;
          font-size: 20px;
        }

        .card-body {
          padding: 28px 24px !important;
        }

        .form-label {
          color: #9A9DA5 !important;
          font-size: 12px !important;
          font-weight: 600 !important;
          letter-spacing: 0.8px !important;
          text-transform: uppercase !important;
          margin-bottom: 8px !important;
          transition: color 0.2s;
        }

        .form-control {
          background: rgba(255,255,255,0.05) !important;
          border: 1px solid #2A2D35 !important;
          border-radius: 10px !important;
          color: #F0F0F0 !important;
          padding: 12px 16px !important;
          font-size: 15px !important;
          transition: all 0.25s !important;
        }

        .form-control::placeholder { color: #555860 !important; }

        .form-control:focus {
          background: rgba(245,197,24,0.06) !important;
          border-color: #F5C518 !important;
          box-shadow: 0 0 0 3px rgba(245,197,24,0.12) !important;
          color: #F0F0F0 !important;
        }

        .btn-warning {
          background: #F5C518 !important;
          border: none !important;
          color: #0A0A0A !important;
          font-weight: 700 !important;
          font-size: 15px !important;
          padding: 13px !important;
          border-radius: 10px !important;
          transition: all 0.25s !important;
        }

        .btn-warning:hover {
          background: #D4A800 !important;
          transform: translateY(-2px) !important;
          box-shadow: 0 8px 24px rgba(245,197,24,0.3) !important;
          color: #0A0A0A !important;
        }

        .card-footer {
          background: #161820 !important;
          border-top: 1px solid #2A2D35 !important;
          border-radius: 0 0 16px 16px !important;
          padding: 14px 24px !important;
        }

        .btn-outline-secondary {
          color: #7A7D85 !important;
          border-color: #2A2D35 !important;
          border-radius: 8px !important;
          font-size: 13px !important;
          transition: all 0.2s !important;
        }

        .btn-outline-secondary:hover {
          background: #2A2D35 !important;
          color: #F0F0F0 !important;
          border-color: #2A2D35 !important;
        }

        .mb-3 { margin-bottom: 18px !important; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning">
                    <h4>🚕 Book a Ride</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/bookings/create}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Passenger Name</label>
                            <input type="text" name="passengerName"
                                   class="form-control" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pickup Location</label>
                            <input type="text" name="pickupLocation"
                                   class="form-control" placeholder="Where from?" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Drop Location</label>
                            <input type="text" name="dropLocation"
                                   class="form-control" placeholder="Where to?" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">
                            🚀 Book Now
                        </button>
                    </form>
                </div>
                <div class="card-footer">
                    <a th:href="@{/bookings/list}" class="btn btn-outline-secondary btn-sm">
                        View All Bookings →
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Changing the color of the label as focus
    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
        this.closest('.mb-3').querySelector('.form-label').style.color = '#F5C518';
      });
      input.addEventListener('blur', function() {
        this.closest('.mb-3').querySelector('.form-label').style.color = '#9A9DA5';
      });
    });

    // loading text as submit
    document.querySelector('form').addEventListener('submit', function() {
      const btn = this.querySelector('.btn-warning');
      btn.innerHTML = '⏳ Booking...';
      btn.style.opacity = '0.8';
    });
</script>

</body>
</html>
