<!-- templates/review-edit.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111318 !important; font-family: 'Segoe UI', sans-serif; }
        nav { background: rgba(10,10,10,0.9); padding: 14px 32px; border-bottom: 1px solid #2A2D35; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .logo { font-size: 18px; font-weight: 800; color: #fff; text-decoration: none; }
        .logo span { color: #F5C518; }
        .nav-links { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .nav-links a { color: #7A7D85; text-decoration: none; font-size: 12px; padding: 5px 10px; border-radius: 8px; transition: all 0.2s; }
        .nav-links a:hover { color: #F5C518; background: rgba(245,197,24,0.08); }
        .user-badge-admin { background: rgba(245,197,24,0.15); color: #F5C518; border: 1px solid rgba(245,197,24,0.3); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .btn-logout { background: rgba(239,68,68,0.1); color: #EF4444; border: 1px solid rgba(239,68,68,0.2); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; text-decoration: none; }
        .btn-logout:hover { background: #EF4444; color: #fff; }
        .card { background: #1A1D24 !important; border: 1px solid #2A2D35 !important; border-radius: 16px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important; overflow: hidden !important; }
        .card-header { background: #1E3A5F !important; border-bottom: 1px solid #2A2D35 !important; padding: 18px 24px !important; border-radius: 16px 16px 0 0 !important; }
        .card-header h4 { color: #F0F0F0 !important; font-weight: 700 !important; margin: 0 !important; }
        .card-body { padding: 28px 24px !important; }
        .alert-info { background: rgba(245,197,24,0.07) !important; border: 1px solid rgba(245,197,24,0.2) !important; border-radius: 12px !important; color: #F0F0F0 !important; padding: 16px 18px !important; font-size: 14px !important; line-height: 1.8 !important; }
        .alert-info strong { color: #F5C518 !important; }
        .form-label { color: #9A9DA5 !important; font-size: 12px !important; font-weight: 600 !important; letter-spacing: 0.8px !important; text-transform: uppercase !important; margin-bottom: 8px !important; }
        .form-control, .form-select { background: rgba(255,255,255,0.05) !important; border: 1px solid #2A2D35 !important; border-radius: 10px !important; color: #F0F0F0 !important; padding: 12px 16px !important; font-size: 15px !important; transition: all 0.25s !important; }
        .form-control:focus, .form-select:focus { background: rgba(245,197,24,0.06) !important; border-color: #F5C518 !important; box-shadow: 0 0 0 3px rgba(245,197,24,0.12) !important; color: #F0F0F0 !important; }
        .form-select option { background: #1A1D24 !important; color: #F0F0F0 !important; }
        textarea.form-control { resize: none; min-height: 100px; }
        .btn-primary { background: #F5C518 !important; border: none !important; color: #0A0A0A !important; font-weight: 700 !important; font-size: 15px !important; padding: 13px !important; border-radius: 10px !important; transition: all 0.25s !important; }
        .btn-primary:hover { background: #D4A800 !important; transform: translateY(-2px) !important; color: #0A0A0A !important; }
        .btn-secondary { background: transparent !important; border: 1px solid #2A2D35 !important; color: #7A7D85 !important; font-weight: 600 !important; font-size: 15px !important; padding: 13px !important; border-radius: 10px !important; text-decoration: none !important; display: flex !important; align-items: center !important; justify-content: center !important; transition: all 0.25s !important; }
        .btn-secondary:hover { border-color: #7A7D85 !important; color: #F0F0F0 !important; }
        .mb-3 { margin-bottom: 20px !important; }
        .stars-display { font-size: 18px; letter-spacing: 2px; }
    </style>
</head>
<body>
<nav>
    <a class="logo" href="/admin/dashboard">Ride<span>Ease</span></a>
    <div class="nav-links">
        <a href="/bookings/list">🚕 Bookings</a>
        <a href="/users/list">👤 Users</a>
        <a href="/drivers/list">🚗 Drivers</a>
        <a href="/payments/list">💳 Payments</a>
        <a href="/vehicles/list">🚙 Vehicles</a>
        <a href="/reviews/list">⭐ Reviews</a>
        <span class="user-badge-admin">👑 <span th:text="${user.username}"></span></span>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>
</nav>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4>✏️ Edit Review</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <strong>Review ID:</strong> <span th:text="${review.reviewId}"></span><br>
                        <strong>Passenger:</strong> <span th:text="${review.passengerName}"></span><br>
                        <strong>Rating:</strong>
                        <span class="stars-display"
                              th:text="${review.rating == 1 ? '⭐' :
                           review.rating == 2 ? '⭐⭐' :
                           review.rating == 3 ? '⭐⭐⭐' :
                           review.rating == 4 ? '⭐⭐⭐⭐' : '⭐⭐⭐⭐⭐'}">
              </span>
                    </div>
                    <form th:action="@{/reviews/update}" method="post">
                        <input type="hidden" name="reviewId" th:value="${review.reviewId}">
                        <div class="mb-3">
                            <label class="form-label">Comment</label>
                            <textarea name="comment" class="form-control"
                                      th:text="${review.comment}" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select" id="statusSelect">
                                <option value="PENDING"  th:selected="${review.status == 'PENDING'}">⏳ Pending</option>
                                <option value="APPROVED" th:selected="${review.status == 'APPROVED'}">✅ Approved</option>
                                <option value="REJECTED" th:selected="${review.status == 'REJECTED'}">❌ Rejected</option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100">Update</button>
                            <a th:href="@{/reviews/list}" class="btn btn-secondary w-100">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    const select = document.getElementById('statusSelect');
    const colors = { 'PENDING':'#F97316', 'APPROVED':'#22C55E', 'REJECTED':'#EF4444' };
    function updateColor() {
      const color = colors[select.value];
      select.style.borderColor = color;
      select.style.boxShadow = `0 0 0 3px ${color}22`;
    }
    select.addEventListener('change', updateColor);
    updateColor();
    document.querySelector('form').addEventListener('submit', function() {
      const btn = this.querySelector('.btn-primary');
      btn.innerHTML = '⏳ Updating...'; btn.style.opacity = '0.8';
    });
</script>
</body>
</html>
