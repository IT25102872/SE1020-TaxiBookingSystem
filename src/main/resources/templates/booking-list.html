<!-- templates/booking-list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🚕 All Bookings</h3>
        <a th:href="@{/bookings/new}" class="btn btn-warning">
            + New Booking
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Passenger</th>
                    <th>Pickup</th><th>Drop</th>
                    <th>Status</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <!-- Thymeleaf loop — bookings list iterate -->
                <tr th:each="b : ${bookings}">
                    <td th:text="${b.bookingId}"></td>
                    <td th:text="${b.passengerName}"></td>
                    <td th:text="${b.pickupLocation}"></td>
                    <td th:text="${b.dropLocation}"></td>
                    <td><span class="badge bg-warning"
                              th:text="${b.status}"></span></td>
                    <td>
                        <a th:href="@{/bookings/edit/{id}(id=${b.bookingId})}"
                           class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{/bookings/delete/{id}(id=${b.bookingId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this booking?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
