<!-- templates/booking-list.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          background: #111318 !important;
          font-family: 'Segoe UI', sans-serif;
        }

        h3 {
          color: #F5C518 !important;
          font-weight: 700;
          font-size: 24px;
        }

        .btn-warning {
          background: #F5C518 !important;
          border: none !important;
          color: #0A0A0A !important;
          font-weight: 700 !important;
          border-radius: 10px !important;
          padding: 9px 18px !important;
          transition: all 0.25s !important;
        }

        .btn-warning:hover {
          background: #D4A800 !important;
          transform: translateY(-2px) !important;
          box-shadow: 0 8px 20px rgba(245,197,24,0.3) !important;
          color: #0A0A0A !important;
        }

        .card {
          background: #1A1D24 !important;
          border: 1px solid #2A2D35 !important;
          border-radius: 16px !important;
          box-shadow: 0 8px 32px rgba(0,0,0,0.4) !important;
          overflow: hidden !important;
        }

        .card-body {
          padding: 0 !important;
        }

        .table {
          margin: 0 !important;
          color: #F0F0F0 !important;
        }

        .table-hover tbody tr:hover {
          background: rgba(245,197,24,0.04) !important;
          color: #F0F0F0 !important;
        }

        .table-dark th {
          background: #0D0F14 !important;
          color: #7A7D85 !important;
          font-size: 11px !important;
          font-weight: 600 !important;
          letter-spacing: 1px !important;
          text-transform: uppercase !important;
          padding: 14px 20px !important;
          border-color: #2A2D35 !important;
        }

        tbody td {
          padding: 14px 20px !important;
          border-color: rgba(42,45,53,0.6) !important;
          vertical-align: middle !important;
          font-size: 14px !important;
        }

        /* Status badges */
        .badge {
          padding: 5px 12px !important;
          border-radius: 20px !important;
          font-size: 11px !important;
          font-weight: 600 !important;
          letter-spacing: 0.5px !important;
        }

        .badge-pending {
          background: rgba(249,115,22,0.15) !important;
          color: #F97316 !important;
          border: 1px solid rgba(249,115,22,0.3) !important;
        }

        .badge-confirmed {
          background: rgba(34,197,94,0.15) !important;
          color: #22C55E !important;
          border: 1px solid rgba(34,197,94,0.3) !important;
        }

        .badge-cancelled {
          background: rgba(239,68,68,0.15) !important;
          color: #EF4444 !important;
          border: 1px solid rgba(239,68,68,0.3) !important;
        }

        .badge-completed {
          background: rgba(59,130,246,0.15) !important;
          color: #3B82F6 !important;
          border: 1px solid rgba(59,130,246,0.3) !important;
        }

        /* Edit / Delete buttons */
        .btn-primary {
          background: rgba(245,197,24,0.12) !important;
          color: #F5C518 !important;
          border: 1px solid rgba(245,197,24,0.25) !important;
          border-radius: 8px !important;
          font-size: 12px !important;
          font-weight: 600 !important;
          padding: 5px 12px !important;
          transition: all 0.2s !important;
        }

        .btn-primary:hover {
          background: #F5C518 !important;
          color: #0A0A0A !important;
          border-color: #F5C518 !important;
        }

        .btn-danger {
          background: rgba(239,68,68,0.1) !important;
          color: #EF4444 !important;
          border: 1px solid rgba(239,68,68,0.2) !important;
          border-radius: 8px !important;
          font-size: 12px !important;
          font-weight: 600 !important;
          padding: 5px 12px !important;
          transition: all 0.2s !important;
        }

        .btn-danger:hover {
          background: #EF4444 !important;
          color: #fff !important;
          border-color: #EF4444 !important;
        }

        /* Booking ID cell */
        .booking-id {
          font-family: monospace;
          font-size: 12px;
          color: #7A7D85;
          background: rgba(255,255,255,0.05);
          padding: 3px 8px;
          border-radius: 6px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🚕 All Bookings</h3>
        <a th:href="@{/bookings/new}" class="btn btn-warning">
            + New Booking
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th><th>Passenger</th>
                    <th>Pickup</th><th>Drop</th>
                    <th>Status</th><th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="b : ${bookings}">
                    <td><span class="booking-id" th:text="${b.bookingId}"></span></td>
                    <td th:text="${b.passengerName}"></td>
                    <td th:text="${b.pickupLocation}"></td>
                    <td th:text="${b.dropLocation}"></td>
                    <td>
                        <span th:if="${b.status == 'PENDING'}"   class="badge badge-pending">PENDING</span>
                        <span th:if="${b.status == 'CONFIRMED'}" class="badge badge-confirmed">CONFIRMED</span>
                        <span th:if="${b.status == 'CANCELLED'}" class="badge badge-cancelled">CANCELLED</span>
                        <span th:if="${b.status == 'COMPLETED'}" class="badge badge-completed">COMPLETED</span>
                    </td>
                    <td>
                        <a th:href="@{/bookings/edit/{id}(id=${b.bookingId})}"
                           class="btn btn-sm btn-primary">Edit</a>
                        <a th:href="@{/bookings/delete/{id}(id=${b.bookingId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this booking?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // dark style as delete confirm dialog
    document.querySelectorAll('.btn-danger').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const url = this.getAttribute('href');
        if (window.confirm('Are you sure you want to delete this booking?')) {
          window.location.href = url;
        }
      });
    });

    // fade-in animation as table rows
    document.querySelectorAll('tbody tr').forEach((row, i) => {
      row.style.opacity = '0';
      row.style.transform = 'translateY(10px)';
      row.style.transition = 'all 0.3s ease';
      setTimeout(() => {
        row.style.opacity = '1';
        row.style.transform = 'translateY(0)';
      }, i * 60);
    });
</script>

</body>
</html>
