<!-- templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — RideEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #111318 !important; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-wrapper { width: 100%; max-width: 420px; animation: slideUp 0.5s ease forwards; }
        @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand-name { font-size: 32px; font-weight: 800; color: #FFFFFF; }
        .brand-name span { color: #F5C518; }
        .brand-sub { font-size: 14px; color: #7A7D85; margin-top: 6px; }
        .card { background: #1A1D24 !important; border: 1px solid #2A2D35 !important; border-radius: 20px !important; box-shadow: 0 20px 60px rgba(0,0,0,0.5) !important; overflow: hidden; }
        .card::before { content:''; display:block; height:3px; background: linear-gradient(90deg, #F5C518, #D4A800, transparent); }
        .card-body { padding: 36px !important; }
        .form-label { color: #9A9DA5 !important; font-size: 12px !important; font-weight: 600 !important; letter-spacing: 0.8px !important; text-transform: uppercase !important; margin-bottom: 8px !important; transition: color 0.2s; }
        .form-control { background: rgba(255,255,255,0.05) !important; border: 1px solid #2A2D35 !important; border-radius: 10px !important; color: #F0F0F0 !important; padding: 13px 16px !important; font-size: 15px !important; transition: all 0.25s !important; }
        .form-control::placeholder { color: #555860 !important; }
        .form-control:focus { background: rgba(245,197,24,0.06) !important; border-color: #F5C518 !important; box-shadow: 0 0 0 3px rgba(245,197,24,0.12) !important; color: #F0F0F0 !important; }
        .btn-login { width: 100%; background: #F5C518 !important; border: none !important; color: #0A0A0A !important; font-weight: 700 !important; font-size: 15px !important; padding: 14px !important; border-radius: 10px !important; transition: all 0.25s !important; margin-top: 8px; }
        .btn-login:hover { background: #D4A800 !important; transform: translateY(-2px) !important; box-shadow: 0 8px 24px rgba(245,197,24,0.35) !important; }
        .error-box { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 12px 16px; color: #EF4444; font-size: 14px; margin-bottom: 20px; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
        .divider hr { flex: 1; border-color: #2A2D35; margin: 0; }
        .divider span { color: #7A7D85; font-size: 12px; white-space: nowrap; }
        .role-pills { display: flex; gap: 8px; }
        .role-pill { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #2A2D35; background: transparent; color: #7A7D85; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
        .role-pill:hover { border-color: #F5C518; color: #F5C518; }
        .mb-3 { margin-bottom: 20px !important; }
        .register-link { text-align: center; margin-top: 20px; font-size: 13px; color: #7A7D85; }
        .register-link a { color: #F5C518; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="brand">
        <div class="brand-name">Ride<span>Ease</span></div>
        <div class="brand-sub">Taxi Booking Management System</div>
    </div>
    <div class="card">
        <div class="card-body">
            <h5 style="color:#F0F0F0; font-weight:700; margin-bottom:24px;">Welcome back 👋</h5>
            <div th:if="${error}" class="error-box">⚠️ <span th:text="${error}"></span></div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-login">🔐 Login</button>
            </form>
            <div class="divider"><hr><span>Quick Demo Login</span><hr></div>
            <div class="role-pills">
                <button class="role-pill" onclick="fillAdmin()">👑 Admin Demo</button>
                <button class="role-pill" onclick="fillCustomer()">👤 Customer Demo</button>
            </div>
            <div class="register-link">
                No account? <a th:href="@{/users/new}">Register here →</a>
            </div>
        </div>
    </div>
</div>
<script>
    function fillAdmin() {
      document.querySelector('[name=username]').value = 'admin';
      document.querySelector('[name=password]').value = 'admin123';
    }
    function fillCustomer() {
      document.querySelector('[name=username]').value = 'customer';
      document.querySelector('[name=password]').value = 'customer123';
    }
    document.querySelectorAll('.form-control').forEach(input => {
      input.addEventListener('focus', function() {
        this.closest('.mb-3').querySelector('.form-label').style.color = '#F5C518';
      });
      input.addEventListener('blur', function() {
        this.closest('.mb-3').querySelector('.form-label').style.color = '#9A9DA5';
      });
    });
</script>
</body>
</html>
