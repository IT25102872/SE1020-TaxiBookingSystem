<!-- templates/update-booking.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4>✏️ Update Booking</h4>
                </div>
                <div class="card-body">

                    <!-- Existing booking details -->
                    <div class="alert alert-info">
                        <strong>Passenger:</strong>
                        <span th:text="${booking.passengerName}"></span><br>
                        <strong>From:</strong>
                        <span th:text="${booking.pickupLocation}"></span>
                        <strong>→</strong>
                        <span th:text="${booking.dropLocation}"></span>
                    </div>

                    <!-- Update form -->
                    <form th:action="@{/bookings/update}" method="post">

                        <!-- Hidden field — ID pass කරනවා -->
                        <input type="hidden" name="bookingId"
                               th:value="${booking.bookingId}">

                        <div class="mb-3">
                            <label class="form-label">Update Status</label>
                            <select name="status" class="form-select">
                                <option value="PENDING">Pending</option>
                                <option value="CONFIRMED">Confirmed</option>
                                <option value="CANCELLED">Cancelled</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100">
                                Update
                            </button>
                            <a th:href="@{/bookings/list}" class="btn btn-secondary w-100">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
